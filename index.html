<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italy 2026</title><style>body{font-family:system-ui;margin:0;background:linear-gradient(#dff7f4,#f7fbfb);color:#102a2a;padding-bottom:80px}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:white;border:1px solid #dbe8e8;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 24px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}button,.btn{border:0;border-radius:14px;padding:12px;margin:4px;background:#0f766e;color:white;font-weight:800;text-decoration:none;display:inline-block}.secondary{background:#e6f0ff;color:#1643a3}.strip{display:flex;overflow:auto;gap:8px;position:sticky;top:0;background:#f7fbfb;padding:8px;z-index:5}.tab{min-width:115px;background:white;color:#102a2a;border:1px solid #dbe8e8}.tab.active{background:#0f766e;color:white}iframe{width:100%;height:320px;border:0;border-radius:16px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;background:#f7fbfb;padding:8px;border-top:1px solid #dbe8e8}.bottom button{flex:1}.phrase{border:1px solid #dbe8e8;border-radius:14px;padding:10px;margin:8px 0;background:#fbffff}.it{font-size:20px;font-weight:900}.muted{color:#607474}.drop{min-height:50px;border:2px dashed #a7f3d0;border-radius:14px;padding:10px}.check{display:block;margin:8px 0}</style></head><body><main class="wrap"><section id="trip"><h1>טיול איטליה 2026</h1><div class="strip" id="days"></div><div id="day"></div></section><section id="italian" style="display:none"><h1>🇮🇹 ללמוד איטלקית</h1><div class="strip" id="langtabs"></div><div id="lang"></div></section></main><div class="bottom"><button onclick="show('trip')">🗓️ הטיול</button><button onclick="show('italian')">🇮🇹 איטלקית</button></div><script>
const D=[['12/8','נחיתה בנאפולי','Terminal 1 Guesthouse','Terminal 1 Guesthouse Naples Airport',['22:55 נחיתה בנאפולי','לילה במלון ליד השדה'],['דרכונים','כרטיסי עליה למטוס','אישור מלון','מים','נשנושים']],['13/8','מעבר לאיסקיה','Grifo Hotel','Grifo Hotel De Charme SPA Ischia',['מעבורת מנאפולי לאיסקיה','צ׳ק אין ובריכה'],['כרטיסי מעבורת','בגדי ים','קרם הגנה']],['14/8','Castello Aragonese ו-Sant’Angelo','Grifo Hotel','Castello Aragonese Ischia',['Ischia Ponte וטירה','Sant’Angelo בערב'],['נעלי הליכה','מים','כובעים']],['16/8','Negombo Thermal Park','Grifo Hotel','Negombo Lacco Ameno Ischia',['09:00 הגעה ל-Negombo','בריכות וחוף'],['בגדי ים','מגבות','כפכפים']],['20/8','Jeranto Tour','Le Zagare','Lido Belmare Marina del Cantone',['08:45 Lido Belmare','להביא 200 אירו מזומן'],['200 אירו במזומן','בגדי ים','מגבות','נעלי מים']],['21/8','Pompeii','Le Zagare','Pompeii Archaeological Park',['רכבת לפומפיי','09:30-13:30 ביקור'],['כרטיסים','תיק קטן','נעלי הליכה']]];
const PACK={'מסמכים וכסף':['דרכונים לכל המשפחה','כרטיסי טיסה / Boarding passes','ביטוח נסיעות','אישורי הזמנות למלונות ודירה','אישורי סיורים','כרטיסי אשראי + מזומן','200 אירו במזומן ל-Jeranto','צילומי דרכונים בענן ובטלפון'],'ביגוד':['בגדים קלים ל-10 ימים','בגד יפה לערב','סווטשירט קל','נעלי הליכה','סנדלים / כפכפים','כובעים','לבנים וגרביים','פיג׳מות'],'ים ובריכה':['בגדי ים כפולים','מגבות חוף','נעלי מים','שנורקלים','שקיות לבגדים רטובים','נרתיק מים לטלפון'],'בריאות והגנה':['קרם הגנה','אפטר-סאן','תרופות קבועות','משככי כאבים','פלסטרים','תרופה נגד בחילות','דוחה יתושים'],'טכנולוגיה':['מטענים','מטען נייד','מתאם חשמל אירופאי','אוזניות','כבלי USB'],'לילדות ולנסיעות':['ספר / טאבלט','אוזניות','נשנושים','בקבוק מים','מחברת מילים באיטלקית'],'דירה וכביסה':['קפסולות כביסה','שקית כביסה','שקיות ziplock','מגבונים','תרמיל יום']};
const LINKS={'14/8':[['Castello Aragonese - תכנון ביקור','https://www.castelloaragoneseischia.com/en/plan-your-visit']],'16/8':[['Negombo - הזמנות','https://prenotazioni.negombo.it/'],['Negombo - מידע','https://negombo.it/en/useful-info/']],'20/8':[['Chasing Syrens','https://www.chasingsyrens.com/']],'21/8':[['Pompeii - כרטיסים','https://pompeiisites.org/en/buy-tickets/'],['Vivaticket','https://pompeii.vivaticket.it/en/']]};
const LANG=[['בסיסי ונימוס',[['Ciao','צ׳או','שלום / ביי'],['Buongiorno','בואון-ג׳ורנו','בוקר טוב'],['Grazie mille','גראציה מילה','תודה רבה'],['Non capisco','נון קאפיסקו','אני לא מבין/ה'],['Può ripetere?','פואה ריפטרה','אפשר לחזור?']]],['מסעדות',[['Un tavolo per cinque, per favore','און טא-בולו פר צ׳ינקווה','שולחן לחמישה בבקשה'],['Il conto, per favore','איל קונטו','חשבון בבקשה'],['Senza piccante','סנצה פיקאנטה','בלי חריף']]],['גלידה',[['Vorrei un gelato','ווריי און ג׳לאטו','אני רוצה גלידה'],['Due gusti, per favore','דואה גוסטי','שני טעמים בבקשה'],['Pistacchio','פיסטאקיו','פיסטוק'],['Stracciatella','סטראצ׳אטלה','שוקולד צ׳יפס איטלקי']]],['תחבורה',[['Dov’è il porto?','דובה איל פורטו','איפה הנמל?'],['A che ora parte il traghetto?','א קה אורה','מתי יוצאת המעבורת?'],['È questo l’autobus per Nerano?','אה קווסטו','זה האוטובוס לנראנו?']]]];
const MUSIC=['Annalisa','The Kolors','Pinguini Tattici Nucleari','Marco Mengoni','Mahmood','Angelina Mango','Ultimo','Elodie','ALFA'];
function e(s){return encodeURIComponent(s)}function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.86;speechSynthesis.speak(u)}function show(p){trip.style.display=p==='trip'?'block':'none';italian.style.display=p==='italian'?'block':'none';if(p==='italian')renderLang(0)}function checks(a,k){return a.map((x,i)=>`<label class="check"><input type="checkbox" data-k="${k}-${i}"> ${x}</label>`).join('')}function renderDay(i){const d=D[i];days.innerHTML=D.map((x,j)=>`<button class="tab ${i===j?'active':''}" onclick="renderDay(${j})">${x[0]}<br>${x[1]}</button>`).join('');let pack=i===0?`<div class="card"><h2>🧳 רשימת אריזה מלאה לכל הנסיעה</h2><div class="grid">${Object.entries(PACK).map(([c,it],ci)=>`<div class="card"><h3>${c}</h3>${checks(it,'pack'+ci)}</div>`).join('')}</div></div>`:'';day.innerHTML=`<div class="card"><h2>${d[0]} · ${d[1]}</h2><p>לינה: ${d[2]}</p></div>${pack}<div class="card"><h2>🎟️ הזמנות ומידע רשמי</h2>${(LINKS[d[0]]||[]).map(x=>`<a class="btn secondary" target="_blank" href="${x[1]}">${x[0]}</a>`).join('')}</div><div class="card"><h2>🗺️ מפה</h2><iframe src="https://www.google.com/maps?q=${e(d[3])}&output=embed"></iframe></div><div class="card"><h2>🕘 לו״ז</h2><ul>${d[4].map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h2>🎒 מה להביא</h2>${checks(d[5],d[0])}</div>`}function renderLang(i){langtabs.innerHTML=LANG.map((x,j)=>`<button class="tab ${i===j?'active':''}" onclick="renderLang(${j})">${x[0]}</button>`).join('');const phrases=LANG[i][1];const p=phrases[Math.floor(Math.random()*phrases.length)];const words=p[0].split(' ').sort(()=>Math.random()-.5);lang.innerHTML=`<div class="card"><h2>📚 ${LANG[i][0]}</h2>${phrases.map(x=>`<div class="phrase"><div class="it">${x[0]}</div><div>${x[1]}</div><div class="muted">${x[2]}</div><button onclick="speak('${x[0].replaceAll("'","\\'")}')">🔊 השמע</button></div>`).join('')}</div><div class="card"><h2>🃏 כרטיסיות</h2><div class="phrase"><div class="it">${p[0]}</div><button onclick="alert('${p[2]}')">הפוך כרטיס</button></div></div><div class="card"><h2>🎯 בחירה מהירה</h2><button onclick="alert('נכון: ${p[2]}')">בדוק: ${p[0]}</button></div><div class="card"><h2>🧩 סדרו את המשפט</h2><div id="ans" class="drop"></div>${words.map(w=>`<button class="secondary" onclick="ans.innerHTML+=this.textContent+' ';this.disabled=true">${w}</button>`).join('')}<button onclick="alert(ans.textContent.trim()==='${p[0]}'?'Bravissimi!':'המשפט הנכון: ${p[0]}')">בדיקה</button></div><div class="card"><h2>✍️ השלמת משפט</h2><p>${p[2]}</p><input id="fill"><button onclick="alert(fill.value.trim().toLowerCase()==='${p[0].split(' ')[0].toLowerCase()}'?'נכון':'המילה הראשונה: ${p[0].split(' ')[0]}')">בדיקה</button></div><div class="card"><h2>🎵 מוזיקה איטלקית עכשווית</h2>${MUSIC.map(m=>`<div class="phrase"><b>${m}</b><br><a class="btn secondary" target="_blank" href="https://www.google.com/search?q=${e(m+' Italian songs')}">חפש שירים</a></div>`).join('')}<a class="btn secondary" target="_blank" href="https://www.italiamia.com/culture/music/top-italian-songs-and-artists-summer-2026-complete-playlist-guide/">Italia Mia</a><a class="btn secondary" target="_blank" href="https://www.youtube.com/playlist?list=PLy_wKxVmWb4aVmvrij9J92HnbSxkDHgXN">YouTube</a><a class="btn secondary" target="_blank" href="https://music.youtube.com/playlist?list=PL-_HauNKjNPsX9F0_shOvEIG-wsgDx1qm">YouTube Music</a></div>`}renderDay(0);</script></body></html>
