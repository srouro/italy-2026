><div class="card half notice"><h2>⭐ דברים חשובים</h2><ul class="list">${d.important.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card half" id="bring"><h2>🎒 מה להביא</h2>${checks(d.bring,d.id)}</div><div class="card half"><h2>🚨 שימושי באזור</h2><div class="btns">${d.useful.map(x=>mb(x,x)).join('')}</div></div><div class="card"><h2>📍 אטרקציות באזור</h2><div class="grid">${d.attractions.map(x=>`<div class="card third">${rec(x)}</div>`).join('')}</div></div><div class="card"><h2>🍝 מסעדות מומלצות</h2><div class="grid">${d.restaurants.map(x=>`<div class="card third">${rec(x)}</div>`).join('')}</div></div><div class="card"><h2>🍦 גלידה ומתוקים</h2>${d.gelato.length?'<div class="grid">'+d.gelato.map(x=>`<div class="card third">${rec(x)}</div>`).join('')+'</div>':'<p class="muted">אין המלצת גלידה מיוחדת ליום הזה.</p>'}</div><div class="card"><h2>🔗 קישורים נוספים</h2><div class="btns">${lb(d.links)}</div></div>`;document.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=localStorage.getItem(cb.dataset.key)==='1';cb.onchange=()=>localStorage.setItem(cb.dataset.key,cb.checked?'1':'0')})}function selectDay(id){let d=days.find(x=>x.id==id)||days[0];localStorage.setItem('selectedDay',id);buttons(id);render(d);scrollTo({top:0,behavior:'smooth'})}notes.value=localStorage.getItem('tripNotes')||'';notes.oninput=()=>localStorage.setItem('tripNotes',notes.value);selectDay(localStorage.getItem('selectedDay')||days[0].id);if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});} </script></body></html>
